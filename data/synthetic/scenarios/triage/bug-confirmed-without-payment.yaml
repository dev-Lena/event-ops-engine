# ① 유형 5 버그 의심 (#20). 질문 · 로그 · id는 모두 합성이다.
# 확정 상태인데 payment_received 로그가 없다 → 규칙으로 설명되지 않는 불변식 위반, 사람이 본다.
policy: ../../../../policy/events/synthetic-example.yaml
now: 2026-11-07T10:00:00+09:00
sessions:
  - { id: s1, date: 2026-11-21 }
registrations:
  - { id: r1, session: s1, members: [{ gender: female, birth_year: 1994 }],
      status_events: [{ at: 2026-11-01T10:00:00+09:00, status: pending_payment },
                      { at: 2026-11-02T10:00:00+09:00, status: confirmed }] }
log:
  - { id: e1, at: 2026-11-01T10:00:01+09:00, kind: account_issued, registration: r1,
      attrs: { bank: synthetic, digits: 14 } }
question:
  id: q1
  text: "r1 신청자가 확정으로 떠 있는데 입금 기록이 안 보여요. 뭔가 잘못된 건가요?"
  canned:
    facts:
      - { relation: asks_about, args: [payment],
          provenance: { source: question, quote: "입금 기록이 안 보여요" }, confidence: 0.8 }
      - { relation: about_registration, args: [r1],
          provenance: { source: question, quote: "r1 신청자" }, confidence: 0.95 }
expected: { kind: accept, cause: suspected_bug, needs: [] }
