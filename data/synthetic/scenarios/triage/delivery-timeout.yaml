# ① 유형 2 외부 요인 (발송 업체 지연, #16). 질문 · 로그 · id는 모두 합성이다.
# 발송이 timeout으로 끝났지만 업체 수신증이 delivered로 도착했다 → 정상, 재발송 불필요.
policy: ../../../../policy/events/synthetic-example.yaml
now: 2026-11-07T10:00:00+09:00
sessions:
  - { id: s1, date: 2026-11-21 }
registrations:
  - { id: r1, session: s1, members: [{ gender: female, birth_year: 1996 }],
      status_events: [{ at: 2026-11-01T10:00:00+09:00, status: pending_payment }] }
log:
  - { id: e1, at: 2026-11-01T10:00:05+09:00, kind: message_sent, registration: r1,
      attrs: { channel: sms, result: timeout } }
  - { id: e2, at: 2026-11-01T10:02:00+09:00, kind: provider_receipt, registration: r1,
      attrs: { channel: sms, result: delivered } }
question:
  id: q1
  text: "r1 신청자가 입금 안내 문자를 못 받았다는데, 발송 실패인가요?"
  canned:   # 가짜 해석기의 답. 실제로는 Claude Code CLI가 같은 형식으로 낸다.
    facts:
      - { relation: asks_about, args: [delivery],
          provenance: { source: question, quote: "문자를 못 받았다는데" }, confidence: 0.9 }
      - { relation: about_registration, args: [r1],
          provenance: { source: question, quote: "r1 신청자" }, confidence: 0.95 }
expected: { kind: accept, cause: external_delay, needs: [] }
