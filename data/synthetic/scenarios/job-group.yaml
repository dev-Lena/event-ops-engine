# "백엔드 3년차" · "UX 디자이너예요"는 정책의 별칭 사전으로 확정되어 정규화기를 부르지 않는다.
# "마케팅 겸 기획"은 별칭이 두 값(other · product)에 걸려 정규화기로 간다.
canned_job_groups:
  "마케팅 겸 기획 하고 있어요": { value: product, confidence: 0.55, quote: "기획" }   # 기준 미만 → 확인 요청
  "대학원생":                 { value: student, confidence: 0.9, quote: "대학원생" }  # 목록 밖 값 → 확인 요청
