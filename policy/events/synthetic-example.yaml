# Synthetic example policy. Numbers are ASSUMED unless the comment says 확인값 or names the
# ops-data check (docs/design.md 7, 13); replace them with the operator's own policy. No real event, client or person is described.
event: synthetic-reading-club

dimensions:
  gender:
    values: [female, male]
  age_band:
    from: birth_year
    bands:
      - { name: "20s", min_age: 20, max_age: 29 }
      - { name: "30s", min_age: 30, max_age: 39 }
      - { name: "40s_plus", min_age: 40 }

defaults:
  capacity: 12
  targets:
    gender:
      female: { lo: 6, hi: 6 }
      male: { lo: 6, hi: 6 }
    age_band:
      "20s": { lo: 2 }          # hi defaults to the session capacity
      "30s": { lo: 4 }
  ratios:
    - { dim: gender, values: [female, male], max_diff: 1 }   # 가정값

promotion:
  lead_days: 7                # 가정값: 회차 7일 전부터 부족분이 있으면 홍보 (운영사 고정 기준 없음, 5~15일)
  trend_min_per_week: 3       # 가정값: 최근 1주 확정이 3명 미만이면 추세 느림 (pace로 교체 예정)
  promotion_cutoff_hours: 2   # 확인값: 모임 시작 2시간 전부터 홍보 권고 중단 (#52)

triage:
  grace_minutes: 0            # 은행이 기한 시각에 바로 막는다 (운영 자료 확인, 유형 4)
  payment_deadline_hours: 24  # 선별(입금 대기) 뒤 24시간. 회차마다 바꿀 수 있다 (운영 자료 확인)
  min_candidate_confidence: 0.6  # 가정값: 해석기가 이보다 자신 없는 후보 사실은 판정에 쓰지 않는다
  sync_lag_minutes: 10           # 가정값: 결제 업체는 입금 확인인데 입금 대기면 이 시간까지는 반영 대기로 본다 (유형 7)
