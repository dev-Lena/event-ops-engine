# Synthetic policy for a hybrid gathering with fixed-choice attributes (docs/design.md 3, #31).
# Numbers are ASSUMED unless the comment says 확인값. No real event, client or person is described.
event: synthetic-hybrid-meetup

dimensions:
  gender:
    values: [female, male]
  choices:
    mode:                         # 참여 방식: 신청폼에서 고름. 함께 신청한 사람은 같은 방식
      values: [offline, online]
      per: registration
    region:                       # 지역: 신청폼에서 참가자마다 고름
      values: [seoul, gyeonggi, other]

defaults:
  capacity: 16
  targets:
    mode:
      offline: { lo: 8, hi: 12 }  # 가정값
      online: { hi: 4 }           # 가정값
    region:
      seoul: { lo: 4 }            # 가정값

promotion:
  lead_days: 7                # 가정값
  trend_min_per_week: 3       # 가정값
  promotion_cutoff_hours: 2   # 확인값 (#52)
